<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0d0b" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e0483e'/%3E%3Crect x='5' y='5' width='54' height='54' rx='10' fill='none' stroke='%23fff7ee' stroke-width='2.5' opacity='.55'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23fff7ee' font-family='KaiTi,STKaiti,serif'%3EO%3C/text%3E%3C/svg%3E"
    />
    <title>OpenNovel · Story Studio</title>
    <script>
      // 首帧前恢复主题，避免浅色用户看到深色闪烁
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'white' || t === 'aurora') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
